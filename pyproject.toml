[project]
name = "ocr-placas"
version = "0.1.0"
description = "Pipeline de segmentacao e OCR de placas veiculares com Tesseract e EasyOCR"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-python>=4.10.0",
    "pytesseract>=0.3.13",
    "easyocr>=1.7",
    # Dependências transitivas do EasyOCR fixadas no índice CPU.
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocr_placas"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# O EasyOCR declara opencv-python-headless; usamos opencv-python no projeto.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]
